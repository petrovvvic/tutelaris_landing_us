<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tutelaris – Links</title>
  <meta name="description" content="Tutelaris: website, LinkedIn, free demo and contact.">
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://tutelarisapp.com/qr-code-links/">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#4f89fb">
  <link rel="stylesheet" href="/assets/fonts/fonts.css">
  <style>
    *{box-sizing:border-box;}
    html,body{margin:0;padding:0;}
    body{
      min-height:100vh;min-height:100dvh;
      font-family:'Inter',system-ui,-apple-system,sans-serif;
      color:#101828;
      background:linear-gradient(180deg,#eef3fe 0%,#fafafd 55%);
      display:flex;align-items:center;justify-content:center;
      padding:40px 16px;
      -webkit-font-smoothing:antialiased;
    }
    .card{width:100%;max-width:420px;text-align:center;}
    .logo{display:inline-flex;align-items:center;gap:10px;margin-bottom:28px;}
    .logo img:first-child{height:36px;width:auto;}
    .logo img:last-child{height:26px;width:auto;}
    h1{
      font-family:'Plus Jakarta Sans',sans-serif;
      font-size:24px;line-height:1.25;font-weight:800;letter-spacing:-.02em;
      margin:0 0 8px;
    }
    .lead{font-size:15px;line-height:1.6;color:#475467;margin:0 0 32px;}
    .links{display:flex;flex-direction:column;gap:12px;}
    .btn{
      display:flex;align-items:center;justify-content:center;gap:10px;
      min-height:56px;padding:14px 20px;border-radius:14px;
      font-size:16px;font-weight:600;text-decoration:none;
      border:1px solid #d0d5dd;background:#fff;color:#101828;
      box-shadow:0 1px 2px rgba(16,24,40,.05);
      transition:transform .15s ease,box-shadow .15s ease,background .15s ease;
    }
    .btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(15,23,42,.08);}
    .btn:active{transform:none;}
    .btn:focus-visible{outline:3px solid rgba(79,137,251,.45);outline-offset:2px;}
    .btn svg{width:20px;height:20px;flex:0 0 auto;}
    .btn-primary{background:#2f6fd4;border-color:#2f6fd4;color:#fff;}
    .btn-primary:hover{background:#2861bd;}
    .email{
      margin-top:28px;font-size:14px;color:#667085;
    }
    .email a{color:#2f6fd4;font-weight:600;text-decoration:none;}
    .email a:hover{text-decoration:underline;}
    @media (prefers-reduced-motion:reduce){.btn{transition:none;}.btn:hover{transform:none;}}
  </style>
</head>
<body>
  <main class="card">
    <a class="logo" href="https://tutelarisapp.com/" aria-label="Tutelaris homepage">
      <img src="/tutelaris-logo.svg" alt="" aria-hidden="true">
      <img src="/tutelaris-logo-black.png" alt="Tutelaris">
    </a>
    <h1>Capture near misses systematically</h1>
    <p class="lead">Spoken, anonymous reports in under two minutes, turned into patterns and documented measures.</p>

    <nav class="links" aria-label="Tutelaris links">
      <a class="btn" href="https://tutelarisapp.com/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
        Visit our website
      </a>
      <a class="btn" href="https://www.linkedin.com/company/tutelaris/" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="#0a66c2" aria-hidden="true"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13zM7.12 20.45H3.56V9h3.56v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.73V1.73C24 .77 23.2 0 22.22 0z"/></svg>
        Follow us on LinkedIn
      </a>
      <a class="btn btn-primary" href="https://meetings-na2.hubspot.com/andrei-piatrouski" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        Book a free demo
      </a>
    </nav>

    <p class="email">Or email us: <a href="mailto:anfragen@tutelaris.de">anfragen@tutelaris.de</a></p>
  </main>
</body>
</html>
